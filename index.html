// ---- Google Sheet helpers ----
// GET returns { ok, members: [...], feedback: [...] }
async function fetchSheetData() {
  const res = await fetch(WEBAPP_URL, { method: "GET" });
  if (!res.ok) throw new Error("GET failed: " + res.status);
  const data = await res.json();
  if (!data || !data.ok || !Array.isArray(data.members)) throw new Error("bad payload");
  const currentStop = data.progress && typeof data.progress.currentStop !== "undefined" ? Number(data.progress.currentStop) : -1;
  return {
    members: data.members,
    feedback: Array.isArray(data.feedback) ? data.feedback : [],
    progress: { currentStop: isNaN(currentStop) ? -1 : currentStop },
  };
}

// POST body sent as text/plain on purpose — avoids a CORS preflight (OPTIONS)
// request, which Apps Script Web Apps don't handle. The Apps Script side still
// reads it as JSON via JSON.parse(e.postData.contents).
async function postToSheet(body) {
  const res = await fetch(WEBAPP_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("POST failed: " + res.status);
  const data = await res.json();
  if (!data || !data.ok) throw new Error("bad payload");
  return data;
}

function isTruthy(v) {
  return v === true || v === "TRUE" || v === "true" || v === 1;

async function fetchWeather() {
  const url =
    "https://api.open-meteo.com/v1/forecast?latitude=" + QISHAN_LAT +
    "&longitude=" + QISHAN_LNG +
    "&current=temperature_2m,weather_code&hourly=precipitation_probability" +
    "&timezone=Asia%2FTaipei&forecast_days=2";
  const res = await fetch(url);
  if (!res.ok) throw new Error("weather fetch failed: " + res.status);
  const data = await res.json();
  if (!data || !data.current) throw new Error("bad weather payload");
  const idx = Array.isArray(data.hourly && data.hourly.time) ? data.hourly.time.indexOf(data.current.time) : -1;
  const precipProb = idx >= 0 ? data.hourly.precipitation_probability[idx] : null;
  return {
    temp: data.current.temperature_2m,
    code: data.current.weather_code,
    precipProb,
  };
}

function CheckInGauge({ count, total, label }) {
  const gaugeLabel = label || "已報到";
  const r = 54;
  const c = 2 * Math.PI * r;
  const frac = count / total;
  return (
    <div style={{ position: "relative", width: 132, height: 132, margin: "0 auto" }}>
      <svg width="132" height="132" viewBox="0 0 132 132">
        <circle cx="66" cy="66" r={r} fill="none" stroke="#EAE0C6" strokeWidth="12" />
        <circle
          cx="66" cy="66" r={r} fill="none" stroke={COLORS.plantGreen} strokeWidth="12" strokeLinecap="round"
          strokeDasharray={`${c * frac} ${c}`} transform="rotate(-90 66 66)"
          style={{ transition: "stroke-dasharray 0.5s ease" }}
        />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
        <div style={{ fontSize: 28, fontWeight: 800, color: COLORS.deepGreen, lineHeight: 1 }}>{count}/{total}</div>
        <div style={{ fontSize: 13, color: "#8A7A5C", fontWeight: 600, marginTop: 4 }}>{gaugeLabel}</div>
      </div>
    </div>
  );
}

            🏍️ 出發囉！
          </button>
        </div>
      )}

      {progress.currentStop >= 0 && next && (
        <button
          onClick={onAdvance}
          style={{
            width: "100%", marginTop: 14, padding: "12px 0", borderRadius: 14, cursor: "pointer",
            border: `1px solid ${COLORS.plantGreen}`, background: "white", color: COLORS.plantGreen, fontWeight: 700, fontSize: 15,
          }}
        >
          ✅ 抵達下一站：{next.name}
        </button>
      )}
    </Card>
  );
}

function ProgressTimeline({ progress }) {
  const [day, setDay] = useState(1);
  const stops = STOPS.filter((s) => s.day === day);

  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: "#8A7A5C" }}>旅程進度</div>
        <div style={{ display: "flex", gap: 6 }}>
          {[1, 2].map((d) => (
            <button
              key={d}
              onClick={() => setDay(d)}
              style={{
                fontSize: 13, fontWeight: 700, padding: "4px 12px", borderRadius: 999, cursor: "pointer",
                border: day === d ? "none" : "1px solid #DCD3B8",
                background: day === d ? COLORS.deepGreen : "white",
                color: day === d ? "white" : "#8A7A5C",
              }}
            >
              Day {d}
            </button>
          ))}
        </div>
      </div>
      <div>
        {stops.map((s) => {
          const done = progress.currentStop >= s.id;
          const isCurrent = progress.currentStop === s.id;
          return (
            <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid #F0EAD8" }}>
              <div style={{ fontSize: 17 }}>{done ? "🟢" : "⚪"}</div>
              <div style={{ fontSize: 13, color: "#8A7A5C", fontWeight: 600, width: 66 }}>{s.time}</div>
              <div style={{ fontSize: 15, fontWeight: isCurrent ? 800 : 600, color: done ? COLORS.deepGreen : COLORS.ink }}>
                {s.name}
                {s.note ? <span style={{ fontSize: 12, color: "#B0A480" }}>（{s.note}）</span> : null}
              </div>
            </div>
          );
        })}
      </div>
    </Card>
  );
}

function WeatherCard() {
  const [weather, setWeather] = useState(null);
  const [state, setState] = useState("loading"); // loading | ok | error

  const load = async () => {
    try {
      const w = await fetchWeather();
      setWeather(w);
      setState("ok");
    } catch (e) {
      setState("error");
    }
  };

  useEffect(() => {
    load();
    const t = setInterval(load, 15 * 60 * 1000); // 天氣不用像報到那樣每 4 秒抓，15 分鐘更新一次就夠
    return () => clearInterval(t);
  }, []);

  const info = weather ? weatherInfo(weather.code) : null;

  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: "#8A7A5C" }}>🌤️ 旗山即時天氣</div>
        <button onClick={load} style={{ fontSize: 13, color: COLORS.plantGreen, background: "none", border: "none", cursor: "pointer", fontWeight: 700 }}>
          重新整理
        </button>
      </div>

      {state === "loading" && <div style={{ marginTop: 8, fontSize: 15, color: "#9A8E6E" }}>讀取中…</div>}
      {state === "error" && <div style={{ marginTop: 8, fontSize: 15, color: COLORS.orange }}>天氣資料暫時讀不到，稍後自動重試</div>}

      {state === "ok" && weather && (
        <>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 10 }}>
            <div style={{ fontSize: 36 }}>{info.icon}</div>
            <div>
              <div style={{ fontSize: 28, fontWeight: 800, color: COLORS.deepGreen, lineHeight: 1 }}>{Math.round(weather.temp)}°C</div>
              <div style={{ fontSize: 14, color: "#8A7A5C", fontWeight: 600, marginTop: 3 }}>{info.label}</div>
            </div>
          </div>
          {weather.precipProb !== null && (
            <div
              style={{
                marginTop: 10, fontSize: 15, fontWeight: 700,
                color: weather.precipProb >= 50 ? COLORS.orange : COLORS.ink,
              }}
            >
              💧 降雨機率 {weather.precipProb}%{weather.precipProb >= 50 ? "，記得帶雨衣" : ""}
            </div>
          )}
        </>
      )}
    </Card>
  );
}

// ==================================================
// 報到 — 現在獨立成自己的分頁，出發報到 ＋ 到家報到 兩組
// ==================================================
function CheckinBlock({
  icon, title, gaugeLabel, people, doneField, myId,
  buttonPendingLabel, buttonDoneLabel, remainingLabel, allDoneLabel,
  onCheckIn, onReset, syncState, resetLabel,
}) {
  const [confirmingReset, setConfirmingReset] = useState(false);
  const count = people.filter((p) => p[doneField]).length;
  const self = people.find((p) => p.id === myId);
  const remaining = 9 - count;
  const selfDone = self ? self[doneField] : false;

  return (
    <Card>
      <div style={{ fontSize: 17, fontWeight: 800, color: COLORS.deepGreen, marginBottom: 10 }}>{icon} {title}</div>
      <CheckInGauge count={count} total={9} label={gaugeLabel} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", rowGap: 16, marginTop: 20, justifyItems: "center" }}>
        {people.map((p) => (
          <Avatar key={p.id} person={{ ...p, checkedIn: p[doneField], self: p.id === myId }} />
        ))}
      </div>

      <button
        onClick={onCheckIn}
        disabled={selfDone}
        style={{
          width: "100%", marginTop: 22, padding: "16px 0", borderRadius: 18, border: "none", fontSize: 20, fontWeight: 800, color: "white",
          background: selfDone ? "linear-gradient(135deg, #9CC0A8, #7FAF8C)" : `linear-gradient(135deg, ${COLORS.plantGreen}, ${COLORS.deepGreen})`,
          boxShadow: selfDone ? "none" : "0 10px 22px rgba(31,74,61,0.35)", transition: "all 0.25s ease", cursor: selfDone ? "default" : "pointer",
        }}
      >
        {selfDone ? buttonDoneLabel : buttonPendingLabel}
      </button>

      <div style={{ textAlign: "center", marginTop: 14, fontSize: 15, color: "#8A7A5C", fontWeight: 500, lineHeight: 1.6 }}>
        {remaining === 0 ? (
          <span style={{ color: COLORS.orange, fontWeight: 700 }}>{allDoneLabel}</span>
        ) : (
          <>還有 {remaining} 位家人{remainingLabel}</>
        )}
      </div>

      <div style={{ textAlign: "center", marginTop: 10, fontSize: 13, color: syncState === "error" ? COLORS.orange : "#B0A480", fontWeight: 500 }}>
        {syncState === "error" ? "同步失敗，稍後自動重試" : "🟢 已同步"}
      </div>

      <div style={{ textAlign: "center", marginTop: 10 }}>
        {confirmingReset ? (
          <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
            <button
              onClick={() => { onReset(); setConfirmingReset(false); }}
              style={{ fontSize: 13, fontWeight: 700, color: "white", background: COLORS.red, border: "none", borderRadius: 999, padding: "6px 14px", cursor: "pointer" }}
            >
              再按一次，確定{resetLabel}
            </button>
            <button
              onClick={() => setConfirmingReset(false)}
              style={{ fontSize: 13, fontWeight: 700, color: "#8A7A5C", background: "none", border: "1px solid #DCD3B8", borderRadius: 999, padding: "6px 14px", cursor: "pointer" }}
            >
              取消
            </button>
          </div>
        ) : (
          <button
            onClick={() => setConfirmingReset(true)}
            style={{ fontSize: 13, color: "#B0A480", background: "none", border: "none", textDecoration: "underline", cursor: "pointer" }}
          >
            {resetLabel}
          </button>
        )}
      </div>
    </Card>
  );
}

// ==================================================
// Phase 3: 地圖
// ==================================================
function MapTab() {
  const [openIdx, setOpenIdx] = useState(null);
  const mapElRef = useRef(null);
  const mapObjRef = useRef(null);

  useEffect(() => {
    if (!mapElRef.current || mapObjRef.current || typeof L === "undefined") return;
    const pins = LOCATIONS.filter((l) => l.configured && l.lat && l.lng);
    const center = pins.length ? [pins[0].lat, pins[0].lng] : [QISHAN_LAT, QISHAN_LNG];
    const map = L.map(mapElRef.current, { attributionControl: true }).setView(center, 14);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
    pins.forEach((loc) => {
      L.marker([loc.lat, loc.lng]).addTo(map).bindPopup("<b>" + loc.name + "</b><br/>" + (loc.desc || ""));
    });
    mapObjRef.current = map;
    return () => {
      map.remove();
      mapObjRef.current = null;
    };
  }, []);

  return (
    <div style={{ paddingBottom: 96 }}>
      <HeroBanner />
      <div style={{ margin: "18px 16px 0", fontSize: 19, fontWeight: 800, color: COLORS.deepGreen }}>📍 旅行地圖</div>

      <Card style={{ padding: 0, overflow: "hidden" }}>
        <div ref={mapElRef} style={{ width: "100%", height: 260 }} />
        <div style={{ padding: "10px 14px", fontSize: 13, color: "#9A8E6E" }}>
          圖釘目前只有「集合地點」是已知位置(約略位置，非精確門口)；其他地點確定後會再補上
        </div>
      </Card>

      {LOCATIONS.map((loc, i) => (
        <Card key={loc.type} style={{ padding: "14px 16px" }}>
          <button onClick={() => setOpenIdx(openIdx === i ? null : i)} style={{ width: "100%", background: "none", border: "none", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", padding: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ fontSize: 22 }}>{loc.icon}</div>
              <div style={{ textAlign: "left" }}>
                <div style={{ fontSize: 13, color: "#8A7A5C", fontWeight: 600 }}>{loc.type}</div>
                <div style={{ fontSize: 17, color: COLORS.ink, fontWeight: 700 }}>{loc.configured ? loc.name : "待設定"}</div>
              </div>
            </div>
            <div style={{ fontSize: 14, color: COLORS.plantGreen, fontWeight: 700 }}>{openIdx === i ? "收合" : "詳情"}</div>
          </button>
          {openIdx === i && (
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px solid #E9DFC4" }}>
              {loc.configured ? (
                <>
                  <div style={{ fontSize: 15, color: COLORS.ink, lineHeight: 1.6 }}>{loc.desc}</div>
                  <a
                    href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc.name)}`}
                    target="_blank"
                    rel="noreferrer"
                    style={{ display: "inline-block", marginTop: 10, fontSize: 15, fontWeight: 700, color: "white", background: COLORS.deepGreen, borderRadius: 999, padding: "8px 16px", textDecoration: "none" }}
                  >
                    📍 開啟手機地圖
                  </a>
                </>
              ) : (
                <div style={{ fontSize: 15, color: "#9A8E6E" }}>這裡目前是 Prototype，尚未接上正式資料服務。</div>
              )}
            </div>
          )}
        </Card>
      ))}
    </div>
  );
}

        })}
      </Card>
    </div>
  );
}

// ==================================================
// Phase 8: 成就
// ==================================================
function AchievementTab({ ctx }) {
  return (
    <div style={{ paddingBottom: 96 }}>
      <HeroBanner />
      <div style={{ margin: "18px 16px 0", fontSize: 19, fontWeight: 800, color: COLORS.deepGreen }}>🏆 旅程成就</div>
      <Card>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", rowGap: 18, justifyItems: "center" }}>
          {ACHIEVEMENT_DEFS.map((a) => {
            const unlocked = a.check(ctx);
            return (
              <div key={a.key} style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 78 }}>
                <div
                  style={{
                    width: 60, height: 60, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28,
                    background: unlocked ? "#FDF1D6" : "#F0EBDD",
                    border: unlocked ? `2px solid ${COLORS.gold}` : "2px solid #DCD3B8",
                    opacity: unlocked ? 1 : 0.4,
                  }}
                >
                  {a.icon}
                </div>
                <div style={{ fontSize: 13, marginTop: 6, fontWeight: 700, textAlign: "center", color: unlocked ? COLORS.deepGreen : "#9A8E6E" }}>
                  {a.label}
                </div>
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

// ==================================================
// App shell — 身份辨識、資料抓取／輪詢、寫入動作全部集中在這裡，
// 5 個分頁都從這裡拿資料，不用各自重複一套邏輯。
// ==================================================
const TABS = [
  { key: "checkin", label: "報到", icon: "👋" },
  { key: "journey", label: "旅程", icon: "🏍️" },
  { key: "map", label: "地圖", icon: "📍" },
  { key: "quest", label: "任務", icon: "🎯" },
  { key: "badge", label: "成就", icon: "🏆" },
];

function App() {
  const [tab, setTab] = useState("checkin");
  const [myId, setMyId] = useState(null);
  const [identityLoading, setIdentityLoading] = useState(true);
  const [people, setPeople] = useState(FAMILY.map((p) => ({ ...p, checkedIn: false, arrivedHome: false })));
  const [loaded, setLoaded] = useState(false); // true once the Google Sheet has been read successfully at least once
  const [feedback, setFeedback] = useState([]);
  const [trip, setTrip] = useState(DEFAULT_TRIP);
  const [progress, setProgress] = useState(DEFAULT_PROGRESS);
  const [syncState, setSyncState] = useState("loading");
  const pollRef = useRef(null);
  const seededTripRef = useRef(false);

  const applyMembers = (members) => {
    setPeople((prev) =>
      prev.map((p) => {
        const row = members.find((m) => m.id === p.sheetId);
        return row ? { ...p, checkedIn: isTruthy(row.checkedIn), arrivedHome: isTruthy(row.arrivedHome) } : p;
      })
    );
  };

  const fetchAll = async () => {
    let ok = true;

    // Google Sheet is the ONLY source of truth for 報到／到家／輕量回饋. On
    // failure we never invent numbers or reset anything — keep whatever was
    // last successfully loaded and let the next 4-second poll retry.
    try {
      const { members, feedback: fb, progress: prog } = await fetchSheetData();
      applyMembers(members);
      setFeedback(fb);
      setProgress(prog);
      setLoaded(true);
    } catch (e) {
      ok = false;
    }

    // Trip state (次一站/公告/任務) 跟這次改動無關，維持原樣 — Claude Artifact
    // Shared Storage（在 GitHub Pages 上本來就不會真的同步，屬已知限制）。
    try {
      const res = await window.storage.get(TRIP_KEY, true);
      const data = res ? JSON.parse(res.value) : null;
      if (data) {
        setTrip({ ...DEFAULT_TRIP, ...data, tasks: { ...DEFAULT_TRIP.tasks, ...(data.tasks || {}) } });
      } else if (!seededTripRef.current) {
        seededTripRef.current = true;
        await window.storage.set(TRIP_KEY, JSON.stringify(DEFAULT_TRIP), true);
      }
    } catch (e) {
      if (!seededTripRef.current) {
        seededTripRef.current = true;
        try {
          await window.storage.set(TRIP_KEY, JSON.stringify(DEFAULT_TRIP), true);
        } catch (e2) {}
      }
    }

    setSyncState(ok ? "ok" : "error");
  };

  // Identity comes from a per-person link (?who=xiang) — bookmark once, works
  // forever, no login and no storage needed.
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const who = params.get("who");
    if (who) {
      const match = FAMILY.find((p) => p.sheetId === who);
      if (match) setMyId(match.id);
    }
    setIdentityLoading(false);
  }, []);

  useEffect(() => {
    if (myId === null) return;
    fetchAll();
    pollRef.current = setInterval(fetchAll, POLL_MS);
    return () => clearInterval(pollRef.current);
  }, [myId]);

  const handlePickIdentity = (id) => {
    setMyId(id);
    const person = FAMILY.find((p) => p.id === id);
    if (person) {
      try {
        const url = new URL(window.location.href);
        url.searchParams.set("who", person.sheetId);
        window.history.replaceState({}, "", url.toString());
      } catch (e) {}
    }
  };

  const handleCheckIn = async () => {
    const me = FAMILY.find((p) => p.id === myId);
    if (!me) return;
    setPeople((prev) => prev.map((p) => (p.id === myId ? { ...p, checkedIn: true } : p))); // instant feedback
    try {
      await postToSheet({ action: "checkin", id: me.sheetId });
      setSyncState("ok");
      fetchAll();
    } catch (e) {
      setSyncState("error");
    }
  };

  const handleCheckInHome = async () => {
    const me = FAMILY.find((p) => p.id === myId);
    if (!me) return;
    setPeople((prev) => prev.map((p) => (p.id === myId ? { ...p, arrivedHome: true } : p))); // instant feedback
    try {
      await postToSheet({ action: "checkinHome", id: me.sheetId });
      setSyncState("ok");
      fetchAll();
    } catch (e) {
      setSyncState("error");
    }
  };

  const handleResetCheckin = async () => {
    try {
      await postToSheet({ action: "resetAll" });
      setSyncState("ok");
      await fetchAll();
    } catch (e) {
      setSyncState("error");
    }
  };

  const handleResetCheckinHome = async () => {
    try {
      await postToSheet({ action: "resetAllHome" });
      setSyncState("ok");
      await fetchAll();
    } catch (e) {
      setSyncState("error");
    }
  };

  const handleAddFeedback = async (type) => {
    const me = FAMILY.find((p) => p.id === myId);
    if (!me) return;
    try {
      await postToSheet({ action: "addFeedback", personId: me.sheetId, personName: me.name, type });
      fetchAll();
    } catch (e) {
      setSyncState("error");
    }
  };

  const handleResolveFeedback = async (id) => {
    setFeedback((prev) => prev.filter((f) => String(f.id) !== String(id))); // instant feedback
    try {
      await postToSheet({ action: "resolveFeedback", id });
    } catch (e) {
      setSyncState("error");
    }
  };

  const handleAdvanceStop = async () => {
    const nextIndex = Math.min(progress.currentStop + 1, STOPS.length - 1);
    setProgress({ currentStop: nextIndex }); // instant feedback
    try {
      await postToSheet({ action: "setStop", stopIndex: nextIndex });
      setSyncState("ok");
      fetchAll();
    } catch (e) {
      setSyncState("error");
    }
  };

  const writeTrip = async (next) => {
    setTrip(next); // instant feedback
    try {
      await window.storage.set(TRIP_KEY, JSON.stringify(next), true);
    } catch (e) {}
  };

  const checkedCount = people.filter((p) => p.checkedIn).length;

  if (identityLoading) {
    return (
      <div style={{ maxWidth: 420, margin: "0 auto", minHeight: "100vh", background: COLORS.cream }}>
        <HeroBanner />
        <div style={{ textAlign: "center", marginTop: 40, color: "#8A7A5C", fontSize: 15 }}>載入中…</div>
      </div>
    );
  }

  if (myId === null) {
    return (
      <div style={{ maxWidth: 420, margin: "0 auto", minHeight: "100vh", background: COLORS.cream }}>
        <IdentityPicker onPick={handlePickIdentity} />
      </div>
    );
  }

  return (
    <div
      style={{
        maxWidth: 420, margin: "0 auto", minHeight: "100vh", background: COLORS.cream,
        fontFamily: '"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif',
        position: "relative",
      }}
    >
      {tab === "checkin" && (
        <CheckinTab
          people={people}
          myId={myId}
          loaded={loaded}
          syncState={syncState}
          onCheckIn={handleCheckIn}
          onCheckInHome={handleCheckInHome}
          onResetCheckin={handleResetCheckin}
          onResetCheckinHome={handleResetCheckinHome}
        />
      )}
      {tab === "journey" && (
        <JourneyHome
          people={people}
          feedback={feedback}
          trip={trip}
          progress={progress}
          myId={myId}
          checkedCount={checkedCount}
          onRequestFeedback={handleAddFeedback}
          onAcknowledgeFeedback={handleResolveFeedback}
          onAdvance={handleAdvanceStop}
          writeTrip={writeTrip}
        />
      )}
      {tab === "map" && <MapTab />}
      {tab === "quest" && (
        <TaskTab
          trip={trip}
          progress={progress}
          checkedCount={checkedCount}
          onToggle={(key) => writeTrip({ ...trip, tasks: { ...trip.tasks, [key]: true } })}
        />
      )}
      {tab === "badge" && <AchievementTab ctx={{ checkedCount, trip, progress }} />}

      <div
        style={{
          position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 420,
          background: COLORS.warmWhite, borderTop: "1px solid #E9DFC4", display: "flex", justifyContent: "space-around",
          padding: "10px 4px 14px", boxShadow: "0 -6px 18px rgba(31,74,61,0.10)",
        }}
      >
        {TABS.map((t) => {
          const active = tab === t.key;
          return (
            <button
              key={t.key}
              onClick={() => setTab(t.key)}
              style={{ background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer", padding: "2px 8px" }}
            >
              <span style={{ fontSize: 22, opacity: active ? 1 : 0.45 }}>{t.icon}</span>
              <span style={{ fontSize: 13, fontWeight: active ? 800 : 500, color: active ? COLORS.deepGreen : "#B0A480" }}>{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
