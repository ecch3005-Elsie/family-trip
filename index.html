async function postToSheet(body) {
  const res = await fetch(WEBAPP_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("POST failed: " + res.status);
  const data = await res.json();
  if (!data || !data.ok) throw new Error(data && data.error ? String(data.error) : "bad payload");
  return data;
}

async function fetchSheetData() {
  const res = await fetch(WEBAPP_URL, { method: "GET" });
  if (!res.ok) throw new Error("GET failed: " + res.status);
  const data = await res.json();
  if (!data || !data.ok || !Array.isArray(data.members)) throw new Error("bad payload");
  const currentStop = data.progress && typeof data.progress.currentStop !== "undefined"
    ? Number(data.progress.currentStop) : -1;
  return {
    members: data.members,
    feedback: Array.isArray(data.feedback) ? data.feedback : [],
    progress: { currentStop: isNaN(currentStop) ? -1 : currentStop },
    guesses: Array.isArray(data.guesses) ? data.guesses : [],
    segments: Array.isArray(data.segments) ? data.segments : [],
    photos: Array.isArray(data.photos) ? data.photos : [],
    tasks: data.tasks || DEFAULT_TRIP.tasks,
    announcements: Array.isArray(data.announcements) ? data.announcements : [],
    day1Result: data.day1Result || null,
    guessLocked: !!data.guessLocked,
  };
}

function isTruthy(v) { return v === true || v === "TRUE" || v === "true" || v === 1; }

function weatherInfo(code) { return WEATHER_CODE_MAP[code] || { icon: "🌤️", label: "" }; }

async function fetchWeather() {
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + QISHAN_LAT +
    "&longitude=" + QISHAN_LNG +
    "&current=temperature_2m,weather_code&hourly=precipitation_probability" +
    "&timezone=Asia%2FTaipei&forecast_days=2";
  const res = await fetch(url);
  if (!res.ok) throw new Error("weather fetch failed");
  const data = await res.json();
  const idx = Array.isArray(data.hourly?.time) ? data.hourly.time.indexOf(data.current.time) : -1;
  return {
    temp: data.current.temperature_2m,
    code: data.current.weather_code,
    precipProb: idx >= 0 ? data.hourly.precipitation_probability[idx] : null,
  };
}

function sumDay1Km(segments) {
  return segments.filter((s) => s.stopIndex <= DAY1_ACCOMMODATION_STOP_ID).reduce((a, s) => a + s.km, 0);
}

function sumAllKm(segments) { return segments.reduce((a, s) => a + s.km, 0); }

function formatTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function formatGuessTime(value) {
  if (value === null || value === undefined || value === "") return "—";
  const str = String(value).trim();
  if (/^\d{1,2}:\d{2}$/.test(str)) return str;
  if (str.indexOf("T") >= 0) {
    const d = new Date(str);
    if (!isNaN(d.getTime())) {
      return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }
  }
  const parts = str.split(":");
  if (parts.length >= 2 && /^\d+$/.test(parts[0])) {
    return String(Number(parts[0])).padStart(2, "0") + ":" + String(Number(parts[1] || 0)).padStart(2, "0");
  }
  return str;
}

function guessTimeToMinutes(value) {
  const t = formatGuessTime(value);
  if (t === "—") return 0;
  const parts = t.split(":");
  return Number(parts[0]) * 60 + Number(parts[1] || 0);
}

function googleMapsNavUrl(loc) {
  if (loc.lat != null && loc.lng != null) {
    return "https://www.google.com/maps/dir/?api=1&destination=" + loc.lat + "," + loc.lng;
  }
  if (loc.name) {
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(loc.name);
  }
  return null;
}

function resolveLocationEntry(loc, progress) {
  if (loc.dynamicNext) {
    const next = STOPS[(progress?.currentStop ?? -1) + 1];
    if (!next) {
      return { ...loc, name: "行程已完成", desc: "全部站點都跑完了", configured: false, lat: null, lng: null };
    }
    const hasCoords = next.lat != null && next.lng != null;
    return {
      ...loc,
      name: next.name,
      desc: "Day " + next.day + " · " + next.time + (next.note ? "（" + next.note + "）" : ""),
      lat: next.lat,
      lng: next.lng,
      configured: hasCoords,
    };
  }
  if (loc.stopId != null) {
    const stop = STOPS.find((s) => s.id === loc.stopId);
    if (stop && stop.lat != null && stop.lng != null) {
      return { ...loc, lat: stop.lat, lng: stop.lng, configured: true };
    }
  }
  return loc;
}

function resolveLocations(progress) {
  return LOCATIONS.map((loc) => resolveLocationEntry(loc, progress));
}

function stopRouteIcon(name) {
  if (!name) return "📍";
  if (/出發|集合|早餐/.test(name)) return "🚩";

  if (/雞|午餐|宴|餐/.test(name)) return "🍜";
  if (/解散|返家|抵達/.test(name)) return "🏁";
  if (/好農|咖啡|雲嶺|五元|草嶺|會館/.test(name)) return "🌿";
  return "🏍️";
}

function formatDateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + formatTime(iso);
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("照片讀取失敗"));
    reader.readAsDataURL(file);
  });
}

function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("照片格式無法讀取")); };
    img.src = url;
  });
}

async function compressImageForUpload(file, maxSide = 1600, quality = 0.75) {
  const smallEnough = file.size <= 500 * 1024;
  let img;
  try {
    img = await loadImageFromFile(file);
  } catch (e) {
    if (smallEnough) {
      const dataUrl = await fileToBase64(file);
      return { base64: dataUrl.split(",")[1], mimeType: file.type || "image/jpeg", fileName: file.name || "photo.jpg" };
    }
    throw e;
  }
  const longest = Math.max(img.width, img.height);
  if (smallEnough && longest <= maxSide) {
    const dataUrl = await fileToBase64(file);
    return { base64: dataUrl.split(",")[1], mimeType: file.type || "image/jpeg", fileName: file.name || "photo.jpg" };
  }
  let width = img.width;
  let height = img.height;
  if (longest > maxSide) {
    const scale = maxSide / longest;
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  if (!ctx) throw new Error("照片壓縮失敗（無法建立 canvas）");
  ctx.drawImage(img, 0, 0, width, height);
  const blob = await new Promise((resolve, reject) => {
    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("照片壓縮失敗"))), "image/jpeg", quality);
  });
  const dataUrl = await fileToBase64(blob);
  const base64 = dataUrl.split(",")[1];
  if (!base64) throw new Error("照片轉換失敗");
  const fileName = (file.name || "photo").replace(/\.[^.]+$/i, "") + ".jpg";
  return { base64, mimeType: "image/jpeg", fileName };
}

function GuessSection({ myId, guesses, guessLocked, checkedCount, day1Result, onSaved }) {
  const me = FAMILY.find((p) => p.id === myId);
  const myGuess = guesses.find((g) => g.personId === me?.sheetId);
  const [km, setKm] = useState(myGuess ? String(myGuess.guessKm) : "");
  const [time, setTime] = useState(formatGuessTime(myGuess?.guessTime) !== "—" ? formatGuessTime(myGuess?.guessTime) : "16:00");
  const [saving, setSaving] = useState(false);

  if (day1Result) {
    const star = FAMILY.find((p) => p.sheetId === day1Result.starPersonId);
    const ranked = guesses.map((g) => {
      const actualMin = new Date(day1Result.arrivalTime).getHours() * 60 + new Date(day1Result.arrivalTime).getMinutes();
      const kmErr = Math.abs(g.guessKm - day1Result.totalKm);
      const timeErr = Math.abs(guessTimeToMinutes(g.guessTime) - actualMin);
      return { ...g, score: kmErr + timeErr / 10 };
    }).sort((a, b) => a.score - b.score);
    return (
      <Card style={{ background: "#FDF1D6", border: `2px solid ${COLORS.gold}` }}>
        <SectionTitle style={{ color: COLORS.deepGreen, fontWeight: 800 }}>⭐ 今日之星出爐！</SectionTitle>
        <div style={{ fontSize: 22, fontWeight: 800, color: COLORS.deepGreen, marginTop: 8 }}>{star ? star.name : "—"}</div>
        <div style={{ fontSize: 15, color: COLORS.ink, marginTop: 6, lineHeight: 1.6 }}>
          實際總公里：<strong>{day1Result.totalKm.toFixed(1)} km</strong><br />
          抵達 {TRIP.day1AccommodationName}：<strong>{formatTime(day1Result.arrivalTime)}</strong>
        </div>
        {ranked.length > 0 && (
          <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px solid #E8D5A0" }}>
            <SectionTitle style={{ marginBottom: 8 }}>🏅 猜測排行榜</SectionTitle>
            {ranked.map((g, i) => (
              <div key={g.personId} style={{ display: "flex", justifyContent: "space-between", fontSize: 14, color: COLORS.ink, padding: "5px 0", fontWeight: g.personId === day1Result.starPersonId ? 800 : 600 }}>
                <span>{i + 1}. {g.personName}{g.personId === day1Result.starPersonId ? " ⭐" : ""}</span>
                <span>{g.guessKm} km · {formatGuessTime(g.guessTime)}</span>
              </div>
            ))}
          </div>
        )}
      </Card>
    );
  }

  if (myGuess) {
    return (
      <Card>
        <SectionTitle>🎲 出發前猜謎（已送出）</SectionTitle>
        <div style={{ fontSize: 15, color: COLORS.ink, marginTop: 10, lineHeight: 1.6 }}>

        <SectionTitle>🎲 出發前猜謎（已鎖定）</SectionTitle>
        <div style={{ fontSize: 15, color: "#8A7A5C", marginTop: 8 }}>已出發，等待抵達住宿揭曉答案！</div>

  return (
    <Card>
      <SectionTitle>🎲 出發前猜謎（Day 1）</SectionTitle>
      <div style={{ fontSize: 14, color: "#8A7A5C", marginTop: 6, lineHeight: 1.5 }}>

function PhotoGallery({ photos, myId, onUploaded }) {
  const me = FAMILY.find((p) => p.id === myId);
  const [uploading, setUploading] = useState(false);
  const inputRef = useRef(null);

  const handleFile = async (file) => {
    if (!file || !me) return;
    setUploading(true);
    try {
      const { base64, mimeType, fileName } = await compressImageForUpload(file);
      await postToSheet({ action: "uploadPhoto", personId: me.sheetId, personName: me.name, imageBase64: base64, mimeType, fileName });
      onUploaded();
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      if (msg.indexOf("POST failed:") === 0) {
        alert("上傳失敗：無法連線到伺服器（" + msg.replace("POST failed: ", "HTTP ") + "）");
      } else if (msg === "bad payload") {
        alert("上傳失敗：伺服器回應異常，請稍後再試");
      } else {
        alert("上傳失敗：" + msg);
      }
    }
    setUploading(false);
  };

  return (
    <Card>
      <SectionTitle>📸 家族合照牆</SectionTitle>
      {photos.length === 0 ? (
        <div style={{ fontSize: 15, color: "#9A8E6E", marginTop: 8 }}>還沒有合照，快來上傳第一張！</div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 8, marginTop: 10 }}>
          {photos.map((p) => (
            <div key={p.id} style={{ borderRadius: 12, overflow: "hidden", background: COLORS.cream }}>
              <img src={p.url} alt="" style={{ width: "100%", height: 120, objectFit: "cover", display: "block" }} />
              <div style={{ padding: "6px 8px", fontSize: 12, fontWeight: 600, color: "#8A7A5C" }}>{p.personName}</div>
            </div>
          ))}
        </div>
      )}
      <input ref={inputRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }}
        onChange={(e) => { handleFile(e.target.files[0]); e.target.value = ""; }} />
      <button onClick={() => inputRef.current?.click()} disabled={uploading} style={{
        width: "100%", marginTop: 12, padding: "12px 0", borderRadius: 12, border: "none",
        background: COLORS.plantGreen, color: "white", fontWeight: 800, cursor: "pointer",
      }}>{uploading ? "上傳中…" : "📷 上傳合照"}</button>
    </Card>
  );
}

            <div key={t.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 0", borderBottom: "1px solid #F0EAD8" }}>
              <div style={{ fontSize: 16, fontWeight: 600, color: done ? COLORS.deepGreen : COLORS.ink }}>{t.icon} {done ? t.doneLabel : t.label}</div>
              {done ? <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.plantGreen }}>✓ 完成啦！</div> : (
                <button onClick={() => onToggle(t.key)} style={{ fontSize: 14, fontWeight: 700, color: "white", background: COLORS.plantGreen, border: "none", borderRadius: 999, padding: "6px 12px", cursor: "pointer" }}>{t.cta}</button>
              )}
            </div>
          );
        })}
      </Card>
    </div>
  );
}

function MapTab({ progress }) {
  const locations = resolveLocations(progress);
  return (
    <div style={{ paddingBottom: 96 }}>
      <HeroBanner /><PageTitle>📍 旅行地圖</PageTitle>
      <Card style={{ padding: 0, overflow: "hidden" }}>
        <JourneyRouteDiagram />
      </Card>
      {locations.map((loc, i) => {
        const navUrl = googleMapsNavUrl(loc);
        return (
          <Card key={loc.type + i} style={{ padding: "14px 16px" }}>
            <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
              <div style={{ fontSize: 22, lineHeight: 1.2 }}>{loc.icon}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <SectionTitle>{loc.type}</SectionTitle>
                {loc.name ? <div style={{ fontSize: 17, color: COLORS.ink, fontWeight: 700, marginTop: 2 }}>{loc.name}</div> : null}
                {loc.desc ? <div style={{ fontSize: 14, color: "#8A7A5C", marginTop: 4, lineHeight: 1.4 }}>{loc.desc}</div> : null}
                {navUrl ? (
                  <a href={navUrl} target="_blank" rel="noopener noreferrer" style={{
                    display: "inline-block", marginTop: 10, padding: "8px 14px", borderRadius: 999,
                    background: COLORS.plantGreen, color: "white", fontSize: 14, fontWeight: 700, textDecoration: "none",
                  }}>🧭 Google Maps 導航</a>
                ) : null}
              </div>
            </div>
          </Card>
        );
      })}
    </div>
  );
}

function AchievementTab({ ctx }) {
  return (
    <div style={{ paddingBottom: 96 }}>
      <HeroBanner /><PageTitle>🏆 旅程成就</PageTitle>
      <Card>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", rowGap: 18, justifyItems: "center" }}>
          {ACHIEVEMENT_DEFS.map((a) => {
            const unlocked = a.check(ctx);
            return (
              <div key={a.key} style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 78 }}>
                <div style={{
                  width: 60, height: 60, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28,
                  background: unlocked ? "#FDF1D6" : "#F0EBDD", border: unlocked ? `2px solid ${COLORS.gold}` : "2px solid #DCD3B8", opacity: unlocked ? 1 : 0.4,
                }}>{a.icon}</div>
                <div style={{ fontSize: 13, marginTop: 6, fontWeight: 700, textAlign: "center", color: unlocked ? COLORS.deepGreen : "#9A8E6E" }}>{a.label}</div>
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

function ReviewTab({ people, trip, progress, segments, photos, day1Result, guesses, feedbackHistory, tripFinished }) {
  if (!tripFinished) {
    return (
      <div style={{ paddingBottom: 96 }}>
        <HeroBanner /><PageTitle>📖 旅行回顧</PageTitle>
        <Card><div style={{ textAlign: "center", padding: "30px 10px", color: "#8A7A5C", fontSize: 15 }}>旅程還在進行中，結束後這裡會自動生成「旅行成績單」✨</div></Card>
      </div>
    );
  }

  const star = FAMILY.find((p) => p.sheetId === day1Result?.starPersonId);
  const totalKm = sumAllKm(segments);
  const unlocked = ACHIEVEMENT_DEFS.filter((a) => a.check({ checkedCount: 9, arrivedHomeCount: people.filter((p) => p.arrivedHome).length, trip, progress, day1Result, mySheetId: "" }));

  return (
    <div style={{ paddingBottom: 96 }}>
      <HeroBanner />
      <Card style={{ background: `linear-gradient(135deg, ${COLORS.deepGreen}, ${COLORS.plantGreen})`, color: COLORS.warmWhite, textAlign: "center", padding: "24px 18px" }}>
        <div style={{ fontSize: 14, opacity: 0.9 }}>🛵 旅行成績單</div>
        <div style={{ fontSize: 22, fontWeight: 800, marginTop: 6 }}>{TRIP.title}</div>
        <div style={{ fontSize: 15, marginTop: 4, opacity: 0.95 }}>{TRIP.subtitle1}</div>
      </Card>

      <Card>
        <SectionTitle>👋 報到紀錄</SectionTitle>
        {people.map((p) => (
          <div key={p.id} style={{ fontSize: 15, color: COLORS.ink, padding: "6px 0", borderBottom: "1px solid #F0EAD8" }}>
            <strong>{p.name}</strong> · 出發 {p.checkinTime ? formatDateTime(p.checkinTime) : "—"} · 到家 {p.homeTime ? formatDateTime(p.homeTime) : "—"}
          </div>
        ))}
      </Card>

      {day1Result && (
        <Card style={{ background: "#FDF1D6" }}>
          <SectionTitle>⭐ 今日之星</SectionTitle>
          <div style={{ fontSize: 24, fontWeight: 800, color: COLORS.deepGreen, marginTop: 6 }}>{star ? star.name : "—"}</div>
          <div style={{ fontSize: 15, color: COLORS.ink, marginTop: 6 }}>
            Day 1 實際 {day1Result.totalKm.toFixed(1)} km · 抵達 {formatTime(day1Result.arrivalTime)}
          </div>
        </Card>
      )}

      <Card>
        <SectionTitle>🛣️ 騎乘里程</SectionTitle>
        <div style={{ fontSize: 28, fontWeight: 800, color: COLORS.deepGreen, marginTop: 6 }}>{totalKm.toFixed(1)} km</div>
        {segments.map((s) => (
          <div key={s.stopIndex} style={{ fontSize: 14, color: "#8A7A5C", padding: "4px 0" }}>{s.stopName}：{s.km} km</div>
        ))}
      </Card>

      <Card>
        <SectionTitle>🎯 完成任務</SectionTitle>
        {TASK_DEFS.map((t) => (
          <div key={t.key} style={{ fontSize: 15, padding: "4px 0" }}>{trip.tasks[t.key] ? "✅" : "⬜"} {t.label}</div>
        ))}
      </Card>

      <Card>
        <SectionTitle>🏆 解鎖成就（{unlocked.length}/{ACHIEVEMENT_DEFS.length}）</SectionTitle>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 8 }}>
          {unlocked.map((a) => <span key={a.key} style={{ fontSize: 14, background: COLORS.cream, borderRadius: 999, padding: "6px 12px" }}>{a.icon} {a.label}</span>)}
        </div>
      </Card>

      {photos.length > 0 && (
        <Card>
          <SectionTitle>📸 合照精選</SectionTitle>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 8, marginTop: 8 }}>
            {photos.slice(0, 6).map((p) => <img key={p.id} src={p.url} alt="" style={{ width: "100%", height: 100, objectFit: "cover", borderRadius: 10 }} />)}
          </div>
        </Card>
      )}

      <Card>
        <SectionTitle>💬 旅途小插曲</SectionTitle>
        {feedbackHistory.length === 0 ? <div style={{ fontSize: 15, color: "#9A8E6E", marginTop: 6 }}>這趟旅程很順利！</div> : feedbackHistory.map((f, i) => (
          <div key={i} style={{ fontSize: 15, padding: "4px 0" }}>{f.personName}：{FEEDBACK_TYPES.find((o) => o.key === f.type)?.label}</div>
        ))}
      </Card>

      <div style={{ margin: "16px", textAlign: "center", fontSize: 14, color: "#8A7A5C" }}>
        截圖這頁，傳到 LINE 群組回味吧 📷<br />瓦特鎮家族，明年見！
      </div>
    </div>
  );
}

function JourneyHome(props) {
  const { pendingAdvance, setPendingAdvance, handleConfirmAdvance, ...rest } = props;
  const next = STOPS[rest.progress.currentStop + 1];
  return (
    <div style={{ paddingBottom: 96 }}>
      <HeroBanner />
      <FeedbackSection feedback={rest.feedback} onRequest={rest.onRequestFeedback} onAcknowledge={rest.onAcknowledgeFeedback} />
      <JourneyStageCard progress={rest.progress} allHere={rest.checkedCount === 9} segments={rest.segments} onRequestAdvance={() => setPendingAdvance(true)} />
      <NextUpCard progress={rest.progress} />
      <ProgressTimeline progress={rest.progress} />
      <AnnouncementSection announcements={rest.trip.announcements} onPost={rest.onPostAnnouncement} />
      <WeatherCard /><SafetyCard />
      <div style={{ margin: "16px 16px 0", padding: "14px 16px", borderRadius: 16, background: `linear-gradient(135deg, ${COLORS.gold}, #F2C463)`, display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{ fontSize: 24 }}>🥮</div>
        <div style={{ fontSize: 15, color: "#4A3617", fontWeight: 600, lineHeight: 1.5 }}>{TRIP.bannerTip}</div>
      </div>
      {pendingAdvance && (
        <KmInputModal
          nextStopName={rest.progress.currentStop === -1 ? STOPS[0].name : (next ? next.name : "")}
          onCancel={() => setPendingAdvance(false)}
          onConfirm={(km) => { setPendingAdvance(false); handleConfirmAdvance(km); }}
        />
      )}
    </div>
  );
}

const TABS = [
  { key: "checkin", label: "報到", icon: "👋" },
  { key: "journey", label: "旅程", icon: "🏍️" },
  { key: "map", label: "地圖", icon: "📍" },
  { key: "quest", label: "任務", icon: "🎯" },
  { key: "badge", label: "成就", icon: "🏆" },
  { key: "review", label: "回顧", icon: "📖" },
];

function App() {
  const [tab, setTab] = useState("checkin");
  const [myId, setMyId] = useState(null);
  const [identityLoading, setIdentityLoading] = useState(true);
  const [people, setPeople] = useState(FAMILY.map((p) => ({ ...p, checkedIn: false, arrivedHome: false, checkinTime: "", homeTime: "" })));
  const [loaded, setLoaded] = useState(false);
  const [feedback, setFeedback] = useState([]);
  const [feedbackHistory, setFeedbackHistory] = useState([]);
  const [trip, setTrip] = useState(DEFAULT_TRIP);
  const [progress, setProgress] = useState(DEFAULT_PROGRESS);
  const [guesses, setGuesses] = useState([]);
  const [segments, setSegments] = useState([]);
  const [photos, setPhotos] = useState([]);
  const [day1Result, setDay1Result] = useState(null);
  const [guessLocked, setGuessLocked] = useState(false);
  const [syncState, setSyncState] = useState("loading");
  const [pendingAdvance, setPendingAdvance] = useState(false);
  const pollRef = useRef(null);

  const applyMembers = (members) => {
    setPeople((prev) => prev.map((p) => {
      const row = members.find((m) => m.id === p.sheetId);
      return row ? { ...p, checkedIn: isTruthy(row.checkedIn), arrivedHome: isTruthy(row.arrivedHome), checkinTime: row.checkinTime || "", homeTime: row.homeTime || "" } : p;
    }));
  };

  const fetchAll = async () => {
    let ok = true;
    try {
      const data = await fetchSheetData();
      applyMembers(data.members);
      setFeedback(data.feedback);
      setProgress(data.progress);
      setGuesses(data.guesses);
      setSegments(data.segments);
      setPhotos(data.photos);
      setDay1Result(data.day1Result);
      setGuessLocked(data.guessLocked);
      setTrip({ ...DEFAULT_TRIP, tasks: data.tasks, announcements: data.announcements });
      setLoaded(true);
    } catch (e) { ok = false; }
    setSyncState(ok ? "ok" : "error");
  };

  useEffect(() => {
    const who = new URLSearchParams(window.location.search).get("who");
    if (who) { const m = FAMILY.find((p) => p.sheetId === who); if (m) setMyId(m.id); }
    setIdentityLoading(false);
  }, []);

  useEffect(() => {
    if (myId === null) return;
    fetchAll();
    pollRef.current = setInterval(fetchAll, POLL_MS);
    return () => clearInterval(pollRef.current);
  }, [myId]);

  const me = FAMILY.find((p) => p.id === myId);
  const checkedCount = people.filter((p) => p.checkedIn).length;
  const tripFinished = progress.currentStop >= STOPS.length - 1;

  const handleConfirmAdvance = async (km) => {
    const nextIndex = Math.min(progress.currentStop + 1, STOPS.length - 1);
    setProgress({ currentStop: nextIndex });
    try {
      await postToSheet({ action: "setStop", stopIndex: nextIndex, segmentKm: km, recordedBy: me?.sheetId || "" });
      setSyncState("ok");
      fetchAll();
    } catch (e) { setSyncState("error"); }
  };

  const shellStyle = { maxWidth: 420, margin: "0 auto", minHeight: "100vh", background: COLORS.cream, fontFamily: '"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif', position: "relative" };

  if (identityLoading) return <div style={shellStyle}><HeroBanner /><div style={{ textAlign: "center", marginTop: 40, color: "#8A7A5C" }}>載入中…</div></div>;
  if (myId === null) return <div style={shellStyle}><IdentityPicker onPick={(id) => { setMyId(id); const p = FAMILY.find((x) => x.id === id); if (p) { const u = new URL(window.location.href); u.searchParams.set("who", p.sheetId); window.history.replaceState({}, "", u); } }} /></div>;

  const ctx = { checkedCount, arrivedHomeCount: people.filter((p) => p.arrivedHome).length, trip, progress, day1Result, mySheetId: me?.sheetId || "" };

  return (
    <div style={shellStyle}>
      {tab === "checkin" && <CheckinTab people={people} myId={myId} loaded={loaded} syncState={syncState} guesses={guesses} guessLocked={guessLocked} checkedCount={checkedCount} day1Result={day1Result} onSaved={fetchAll}
        onCheckIn={async () => { await postToSheet({ action: "checkin", id: me.sheetId }); fetchAll(); }}
        onCheckInHome={async () => { await postToSheet({ action: "checkinHome", id: me.sheetId }); fetchAll(); }}
        onResetCheckin={async () => { await postToSheet({ action: "resetAll" }); fetchAll(); }}
        onResetCheckinHome={async () => { await postToSheet({ action: "resetAllHome" }); fetchAll(); }} />}
      {tab === "journey" && <JourneyHome progress={progress} checkedCount={checkedCount} segments={segments} feedback={feedback} trip={trip}
        pendingAdvance={pendingAdvance} setPendingAdvance={setPendingAdvance} handleConfirmAdvance={handleConfirmAdvance}
        onRequestFeedback={async (type) => { await postToSheet({ action: "addFeedback", personId: me.sheetId, personName: me.name, type }); fetchAll(); }}
        onAcknowledgeFeedback={async (id) => { await postToSheet({ action: "resolveFeedback", id }); fetchAll(); }}
        onPostAnnouncement={async (text, level) => { await postToSheet({ action: "postAnnouncement", text, level }); fetchAll(); }} />}
      {tab === "map" && <MapTab progress={progress} />}
      {tab === "quest" && <TaskTab trip={trip} progress={progress} checkedCount={checkedCount} photos={photos} myId={myId}
        onToggle={async (key) => { await postToSheet({ action: "toggleTask", taskKey: key, value: true }); fetchAll(); }}
        onUploaded={fetchAll} />}
      {tab === "badge" && <AchievementTab ctx={ctx} />}
      {tab === "review" && <ReviewTab people={people} trip={trip} progress={progress} segments={segments} photos={photos} day1Result={day1Result} guesses={guesses} feedbackHistory={feedbackHistory} tripFinished={tripFinished} />}

      <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 420, background: COLORS.warmWhite, borderTop: "1px solid #E9DFC4", display: "flex", justifyContent: "space-around", padding: "8px 2px 12px", boxShadow: "0 -6px 18px rgba(31,74,61,0.10)" }}>
        {TABS.map((t) => {
          const active = tab === t.key;
          const locked = t.key === "review" && !tripFinished;
          return (
            <button key={t.key} onClick={() => setTab(t.key)} style={{ background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, cursor: "pointer", padding: "2px 4px", opacity: locked ? 0.4 : 1 }}>
              <span style={{ fontSize: 20, opacity: active ? 1 : 0.45 }}>{t.icon}</span>
              <span style={{ fontSize: 11, fontWeight: active ? 800 : 500, color: active ? COLORS.deepGreen : "#B0A480" }}>{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
