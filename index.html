// ---- Google Sheet helpers ----
// GET returns { ok, members: [...], feedback: [...] }
async function fetchSheetData() {
  const res = await fetch(WEBAPP_URL, { method: "GET" });
  if (!res.ok) throw new Error("GET failed: " + res.status);
  const data = await res.json();
  if (!data || !data.ok || !Array.isArray(data.members)) throw new Error("bad payload");
  return { members: data.members, feedback: Array.isArray(data.feedback) ? data.feedback : [] };
}

// POST body sent as text/plain on purpose — avoids a CORS preflight (OPTIONS)
// request, which Apps Script Web Apps don't handle. The Apps Script side still
// reads it as JSON via JSON.parse(e.postData.contents).
async function postToSheet(body) {
  const res = await fetch(WEBAPP_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("POST failed: " + res.status);
  const data = await res.json();
  if (!data || !data.ok) throw new Error("bad payload");
  return data;
}

function isTruthy(v) {
  return v === true || v === "TRUE" || v === "true" || v === 1;

async function fetchWeather() {
  const url =
    "https://api.open-meteo.com/v1/forecast?latitude=" + QISHAN_LAT +
    "&longitude=" + QISHAN_LNG +
    "&current=temperature_2m,weather_code&hourly=precipitation_probability" +
    "&timezone=Asia%2FTaipei&forecast_days=2";
  const res = await fetch(url);
  if (!res.ok) throw new Error("weather fetch failed: " + res.status);
  const data = await res.json();
  if (!data || !data.current) throw new Error("bad weather payload");
  const idx = Array.isArray(data.hourly && data.hourly.time) ? data.hourly.time.indexOf(data.current.time) : -1;
  const precipProb = idx >= 0 ? data.hourly.precipitation_probability[idx] : null;
  return {
    temp: data.current.temperature_2m,
    code: data.current.weather_code,
    precipProb,
  };
}

function CheckInGauge({ count, total }) {
  const r = 54;
  const c = 2 * Math.PI * r;
  const frac = count / total;
  return (
    <div style={{ position: "relative", width: 132, height: 132, margin: "0 auto" }}>
      <svg width="132" height="132" viewBox="0 0 132 132">
        <circle cx="66" cy="66" r={r} fill="none" stroke="#EAE0C6" strokeWidth="12" />
        <circle
          cx="66" cy="66" r={r} fill="none" stroke={COLORS.plantGreen} strokeWidth="12" strokeLinecap="round"
          strokeDasharray={`${c * frac} ${c}`} transform="rotate(-90 66 66)"
          style={{ transition: "stroke-dasharray 0.5s ease" }}
        />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
        <div style={{ fontSize: 26, fontWeight: 800, color: COLORS.deepGreen, lineHeight: 1 }}>{count}/{total}</div>
        <div style={{ fontSize: 11, color: "#8A7A5C", fontWeight: 600, marginTop: 4 }}>已報到</div>
      </div>
    </div>
  );
}

function NextUpCard({ trip, editable, onSave }) {
  const [editing, setEditing] = useState(false);
  const [stop, setStop] = useState(trip.nextStop);
  const [time, setTime] = useState(trip.nextTime);

  useEffect(() => {
    if (!editing) {
      setStop(trip.nextStop);
      setTime(trip.nextTime);
    }
  }, [trip.nextStop, trip.nextTime, editing]);

  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: "#8A7A5C" }}>⏰ 下一個重要時間</div>
        {editable && !editing && (
          <button onClick={() => setEditing(true)} style={{ background: "none", border: "none", color: COLORS.plantGreen, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
            設定
          </button>
        )}
      </div>

      {editing ? (
        <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
          <input
            value={time}
            onChange={(e) => setTime(e.target.value)}
            placeholder="例如 10:30 出發"
            style={{ padding: "10px 12px", borderRadius: 10, border: "1px solid #DCD3B8", fontSize: 14 }}
          />
          <input
            value={stop}
            onChange={(e) => setStop(e.target.value)}
            placeholder="例如 華山・草嶺"
            style={{ padding: "10px 12px", borderRadius: 10, border: "1px solid #DCD3B8", fontSize: 14 }}
          />
          <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
            <button
              onClick={() => { onSave({ nextStop: stop, nextTime: time }); setEditing(false); }}
              style={{ flex: 1, padding: "10px 0", borderRadius: 10, border: "none", background: COLORS.plantGreen, color: "white", fontWeight: 700, cursor: "pointer" }}
            >
              儲存
            </button>
            <button
              onClick={() => setEditing(false)}
              style={{ flex: 1, padding: "10px 0", borderRadius: 10, border: "1px solid #DCD3B8", background: "none", color: "#8A7A5C", fontWeight: 700, cursor: "pointer" }}
            >
              取消
            </button>
          </div>
        </div>
      ) : (
        <div style={{ marginTop: 8 }}>
          <div style={{ fontSize: 22, fontWeight: 800, color: COLORS.deepGreen }}>{trip.nextTime || "時間待確認"}</div>
          <div style={{ fontSize: 14, color: COLORS.ink, marginTop: 4, fontWeight: 600 }}>
            📍 {trip.nextStop || "下一站待設定"}

        </div>

  );
}

function WeatherCard() {

  useEffect(() => {

    return () => clearInterval(t);

  const info = weather ? weatherInfo(weather.code) : null;

  return (

            <div>

            </div>

// ==================================================
// Main 旅程 (journey/home) tab — combines Phase 1 + 2 + 5 + 6 + 7
// ==================================================
function JourneyHome() {
  const [myId, setMyId] = useState(null);
  const [identityLoading, setIdentityLoading] = useState(true);
  const [people, setPeople] = useState(FAMILY.map((p) => ({ ...p, checkedIn: false })));
  const [loaded, setLoaded] = useState(false); // true once the Google Sheet has been read successfully at least once
  const [feedback, setFeedback] = useState([]); // Phase 2 — 輕量、非緊急的家人回饋
  const [trip, setTrip] = useState(DEFAULT_TRIP);
  const [syncState, setSyncState] = useState("loading");
  const pollRef = useRef(null);
  const seededTripRef = useRef(false);

  const applyMembers = (members) => {
    setPeople((prev) =>
      prev.map((p) => {
        const row = members.find((m) => m.id === p.sheetId);
        return row ? { ...p, checkedIn: isTruthy(row.checkedIn) } : p;
      })
    );
  };

  const fetchAll = async () => {
    let ok = true;

    // Google Sheet is the ONLY source of truth for check-in + 輕量回饋. On
    // failure we never invent numbers or reset anything — keep whatever was
    // last successfully loaded and let the next 4-second poll retry.
    try {
      const { members, feedback: fb } = await fetchSheetData();
      applyMembers(members);
      setFeedback(fb);
      setLoaded(true);
    } catch (e) {
      ok = false;
    }

    // Trip state (next stop / announcements / tasks / SOS) is unrelated to
    // this phase and stays exactly as before — Claude Artifact Shared Storage.
    try {
      const res = await window.storage.get(TRIP_KEY, true);
      const data = res ? JSON.parse(res.value) : null;
      if (data) {
        setTrip({ ...DEFAULT_TRIP, ...data, tasks: { ...DEFAULT_TRIP.tasks, ...(data.tasks || {}) } });
      } else if (!seededTripRef.current) {
        seededTripRef.current = true;
        await window.storage.set(TRIP_KEY, JSON.stringify(DEFAULT_TRIP), true);
      }
    } catch (e) {
      if (!seededTripRef.current) {
        seededTripRef.current = true;
        try {
          await window.storage.set(TRIP_KEY, JSON.stringify(DEFAULT_TRIP), true);
        } catch (e2) {}
      }
    }

    setSyncState(ok ? "ok" : "error");
  };

  const handleAddFeedback = async (type) => {
    const me = FAMILY.find((p) => p.id === myId);
    if (!me) return;
    try {
      await postToSheet({ action: "addFeedback", personId: me.sheetId, personName: me.name, type });
      fetchAll();
    } catch (e) {
      setSyncState("error");
    }
  };

  const handleResolveFeedback = async (id) => {
    setFeedback((prev) => prev.filter((f) => String(f.id) !== String(id))); // instant feedback
    try {
      await postToSheet({ action: "resolveFeedback", id });
    } catch (e) {
      setSyncState("error");
    }
  };

  const writeTrip = async (next) => {
    setTrip(next); // instant feedback
    try {
      await window.storage.set(TRIP_KEY, JSON.stringify(next), true);
    } catch (e) {}
  };

  // Identity now comes from a per-person link (?who=xiang), because neither
  // Google Apps Script nor the free Claude plan can remember "which phone is
  // this" across visits. Each family member should bookmark their own link.
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const who = params.get("who");
    if (who) {
      const match = FAMILY.find((p) => p.sheetId === who);
      if (match) setMyId(match.id);
    }
    setIdentityLoading(false);
  }, []);

  useEffect(() => {
    if (myId === null) return;
    fetchAll();
    pollRef.current = setInterval(fetchAll, POLL_MS);
    return () => clearInterval(pollRef.current);
  }, [myId]);

  const handlePickIdentity = (id) => {
    setMyId(id);
    const person = FAMILY.find((p) => p.id === id);
    if (person) {
      try {
        const url = new URL(window.location.href);
        url.searchParams.set("who", person.sheetId);
        window.history.replaceState({}, "", url.toString());
      } catch (e) {}
    }
  };

  const handleCheckIn = async () => {
    const me = FAMILY.find((p) => p.id === myId);
    if (!me) return;
    setPeople((prev) => prev.map((p) => (p.id === myId ? { ...p, checkedIn: true } : p))); // instant feedback
    try {
      await postToSheet({ action: "checkin", id: me.sheetId });
      setSyncState("ok");
      fetchAll(); // pull the confirmed sheet state right away
    } catch (e) {
      setSyncState("error");
    }
  };

  const [confirmingReset, setConfirmingReset] = useState(false);
  const handleResetCheckin = async () => {
    setConfirmingReset(false);
    try {
      await postToSheet({ action: "resetAll" });
      setSyncState("ok");
      await fetchAll();
    } catch (e) {
      setSyncState("error");
    }
  };

  if (identityLoading) {
    return (
      <div style={{ paddingBottom: 96 }}>
        <HeroBanner />
        <div style={{ textAlign: "center", marginTop: 40, color: "#8A7A5C", fontSize: 13 }}>載入中…</div>
      </div>
    );
  }

  if (myId === null) return <IdentityPicker onPick={handlePickIdentity} />;

  const checkedCount = people.filter((p) => p.checkedIn).length;
  const self = people.find((p) => p.id === myId);
  const remaining = 9 - checkedCount;
  const allHere = checkedCount === 9;
  const ctx = { checkedCount, trip };

  return (
    <div style={{ paddingBottom: 96 }}>
      <HeroBanner />
      <InfoStrip />

      <FeedbackSection feedback={feedback} onRequest={handleAddFeedback} onAcknowledge={handleResolveFeedback} />

      <Card>
        {!loaded ? (
          <div style={{ textAlign: "center", padding: "30px 10px", color: "#8A7A5C", fontSize: 13, fontWeight: 600 }}>
            {syncState === "error" ? "尚未連線，同步失敗，稍後自動重試" : "同步中，正在連接 Google 試算表…"}
          </div>
        ) : (
          <>
            <CheckInGauge count={checkedCount} total={9} />
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", rowGap: 16, marginTop: 20, justifyItems: "center" }}>
              {people.map((p) => (
                <Avatar key={p.id} person={{ ...p, self: p.id === myId }} />
              ))}
            </div>

            <button
              onClick={handleCheckIn}
              disabled={self.checkedIn}
              style={{
                width: "100%", marginTop: 22, padding: "16px 0", borderRadius: 18, border: "none", fontSize: 18, fontWeight: 800, color: "white",
                background: self.checkedIn ? "linear-gradient(135deg, #9CC0A8, #7FAF8C)" : `linear-gradient(135deg, ${COLORS.plantGreen}, ${COLORS.deepGreen})`,
                boxShadow: self.checkedIn ? "none" : "0 10px 22px rgba(31,74,61,0.35)", transition: "all 0.25s ease", cursor: self.checkedIn ? "default" : "pointer",
              }}
            >
              {self.checkedIn ? "✓ 已報到" : "👋 我到啦！"}
            </button>

            <div style={{ textAlign: "center", marginTop: 14, fontSize: 13, color: "#8A7A5C", fontWeight: 500, lineHeight: 1.6 }}>
              {remaining === 0 ? (
                <span style={{ color: COLORS.orange, fontWeight: 700 }}>🎉 全員到齊，準備出發！</span>
              ) : (
                <>還有 {remaining} 位家人尚未抵達<br />大家陸續抵達中，等等還沒到的家人～</>
              )}
            </div>

            <div style={{ textAlign: "center", marginTop: 10, fontSize: 11, color: syncState === "error" ? COLORS.orange : "#B0A480", fontWeight: 500 }}>
              {syncState === "error" ? "同步失敗，稍後自動重試" : "🟢 已同步"}
            </div>

            <div style={{ textAlign: "center", marginTop: 10 }}>
              {confirmingReset ? (
                <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
                  <button
                    onClick={handleResetCheckin}
                    style={{ fontSize: 11, fontWeight: 700, color: "white", background: COLORS.red, border: "none", borderRadius: 999, padding: "6px 14px", cursor: "pointer" }}
                  >
                    再按一次，確定重置全部報到
                  </button>
                  <button
                    onClick={() => setConfirmingReset(false)}
                    style={{ fontSize: 11, fontWeight: 700, color: "#8A7A5C", background: "none", border: "1px solid #DCD3B8", borderRadius: 999, padding: "6px 14px", cursor: "pointer" }}
                  >
                    取消
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => setConfirmingReset(true)}
                  style={{ fontSize: 11, color: "#B0A480", background: "none", border: "none", textDecoration: "underline", cursor: "pointer" }}
                >
                  重置全部報到人數
                </button>
              )}
            </div>
          </>
        )}
      </Card>

      <JourneyStageCard trip={trip} allHere={allHere} onDepart={() => writeTrip({ ...trip, stage: "departed" })} />
      <NextUpCard trip={trip} editable onSave={(patch) => writeTrip({ ...trip, ...patch })} />
      <ProgressTimeline ctx={ctx} />
      <AnnouncementSection
        announcements={trip.announcements}
        onPost={(text, level) => {
          const a = { id: Date.now(), level, text, ts: Date.now() };
          writeTrip({ ...trip, announcements: [a, ...trip.announcements].slice(0, 20) });
        }}
      />
      <SosSection
        sos={trip.sos}
        myId={myId}
        myName={self.name}
        onRequest={(type) => {
          const s = { id: Date.now(), personId: myId, personName: self.name, type, ts: Date.now() };
          writeTrip({ ...trip, sos: [...trip.sos, s] });
        }}
        onResolve={(id) => writeTrip({ ...trip, sos: trip.sos.filter((s) => s.id !== id) })}
      />
      <WeatherCard />
      <SafetyCard />

      <div style={{ margin: "16px 16px 0", padding: "14px 16px", borderRadius: 16, background: `linear-gradient(135deg, ${COLORS.gold}, #F2C463)`, display: "flex", alignItems: "center", gap: 10, boxShadow: "0 6px 14px rgba(232,179,74,0.35)" }}>
        <div style={{ fontSize: 22 }}>🥮</div>
        <div style={{ fontSize: 13, color: "#4A3617", fontWeight: 600, lineHeight: 1.5 }}>
          中秋連假機車小旅行，記得帶好安全帽和防曬，路上互相照應喔！
        </div>
      </div>
    </div>
  );
}

function MapTab() {
  const [openIdx, setOpenIdx] = useState(null);
  const mapElRef = useRef(null);
  const mapObjRef = useRef(null);

  useEffect(() => {
    if (!mapElRef.current || mapObjRef.current || typeof L === "undefined") return;
    const pins = LOCATIONS.filter((l) => l.configured && l.lat && l.lng);
    const center = pins.length ? [pins[0].lat, pins[0].lng] : [QISHAN_LAT, QISHAN_LNG];
    const map = L.map(mapElRef.current, { attributionControl: true }).setView(center, 14);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);
    pins.forEach((loc) => {
      L.marker([loc.lat, loc.lng]).addTo(map).bindPopup("<b>" + loc.name + "</b><br/>" + (loc.desc || ""));
    });
    mapObjRef.current = map;
    return () => {
      map.remove();
      mapObjRef.current = null;
    };
  }, []);

  return (
    <div style={{ paddingBottom: 96 }}>
      <HeroBanner />
      <div style={{ margin: "18px 16px 0", fontSize: 17, fontWeight: 800, color: COLORS.deepGreen }}>📍 旅行地圖</div>

      <Card style={{ padding: 0, overflow: "hidden" }}>
        <div ref={mapElRef} style={{ width: "100%", height: 260 }} />
        <div style={{ padding: "10px 14px", fontSize: 11, color: "#9A8E6E" }}>
          圖釘目前只有「集合地點」是已知位置(約略位置，非精確門口)；其他地點確定後會再補上
        </div>
      </Card>

      {LOCATIONS.map((loc, i) => (
        <Card key={loc.type} style={{ padding: "14px 16px" }}>
          <button onClick={() => setOpenIdx(openIdx === i ? null : i)} style={{ width: "100%", background: "none", border: "none", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", padding: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ fontSize: 20 }}>{loc.icon}</div>
              <div style={{ textAlign: "left" }}>
                <div style={{ fontSize: 11, color: "#8A7A5C", fontWeight: 600 }}>{loc.type}</div>
                <div style={{ fontSize: 15, color: COLORS.ink, fontWeight: 700 }}>{loc.configured ? loc.name : "待設定"}</div>
              </div>
            </div>
            <div style={{ fontSize: 12, color: COLORS.plantGreen, fontWeight: 700 }}>{openIdx === i ? "收合" : "詳情"}</div>
          </button>
          {openIdx === i && (
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px solid #E9DFC4" }}>
              {loc.configured ? (
                <>
                  <div style={{ fontSize: 13, color: COLORS.ink, lineHeight: 1.6 }}>{loc.desc}</div>
                  <a
                    href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc.name)}`}
                    target="_blank"
                    rel="noreferrer"
                    style={{ display: "inline-block", marginTop: 10, fontSize: 13, fontWeight: 700, color: "white", background: COLORS.deepGreen, borderRadius: 999, padding: "8px 16px", textDecoration: "none" }}
                  >
                    📍 開啟手機地圖
                  </a>
                </>
              ) : (
                <div style={{ fontSize: 13, color: "#9A8E6E" }}>這裡目前是 Prototype，尚未接上正式資料服務。</div>
              )}
            </div>
          )}
        </Card>
      ))}
    </div>
  );
}

// ==================================================
// Phase 4: 任務
// ==================================================
function TaskTab({ trip, checkedCount, onToggle }) {
  const autoTasks = [
    { label: "全員集合", icon: "🟢", done: checkedCount === 9 },
    { label: "第一站抵達", icon: "📍", done: trip.stage === "arrived" || trip.stage === "completed" },
  ];
  return (
    <div style={{ paddingBottom: 96 }}>
      <HeroBanner />
      <div style={{ margin: "18px 16px 0", fontSize: 17, fontWeight: 800, color: COLORS.deepGreen }}>🎯 今日任務</div>

      <Card>
        <div style={{ fontSize: 12, fontWeight: 700, color: "#8A7A5C", marginBottom: 8 }}>自動追蹤</div>
        {autoTasks.map((t) => (
          <div key={t.label} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0" }}>
            <div style={{ fontSize: 18 }}>{t.done ? "✅" : "⬜"}</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: t.done ? COLORS.deepGreen : COLORS.ink }}>{t.icon} {t.label}</div>
          </div>
        ))}
      </Card>

      <Card>
        <div style={{ fontSize: 12, fontWeight: 700, color: "#8A7A5C", marginBottom: 8 }}>今天要一起完成</div>
        {TASK_DEFS.map((t) => {
          const done = trip.tasks[t.key];
          return (
            <div key={t.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 0", borderBottom: "1px solid #F0EAD8" }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: done ? COLORS.deepGreen : COLORS.ink }}>
                {t.icon} {done ? t.doneLabel : t.label}
              </div>
              {done ? (
                <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.plantGreen }}>✓ 完成啦！</div>
              ) : (
                <button
                  onClick={() => onToggle(t.key)}
                  style={{ fontSize: 12, fontWeight: 700, color: "white", background: COLORS.plantGreen, border: "none", borderRadius: 999, padding: "6px 12px", cursor: "pointer" }}
                >
                  {t.cta}
                </button>
              )}
            </div>
          );
        })}
      </Card>
    </div>
  );
}

// ==================================================
// Phase 8: 成就
// ==================================================
function AchievementTab({ ctx }) {
  return (
    <div style={{ paddingBottom: 96 }}>
      <HeroBanner />
      <div style={{ margin: "18px 16px 0", fontSize: 17, fontWeight: 800, color: COLORS.deepGreen }}>🏆 旅程成就</div>
      <Card>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", rowGap: 18, justifyItems: "center" }}>
          {ACHIEVEMENT_DEFS.map((a) => {
            const unlocked = a.check(ctx);
            return (
              <div key={a.key} style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 78 }}>
                <div
                  style={{
                    width: 60, height: 60, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26,
                    background: unlocked ? "#FDF1D6" : "#F0EBDD",
                    border: unlocked ? `2px solid ${COLORS.gold}` : "2px solid #DCD3B8",
                    opacity: unlocked ? 1 : 0.4,
                  }}
                >
                  {a.icon}
                </div>
                <div style={{ fontSize: 11, marginTop: 6, fontWeight: 700, textAlign: "center", color: unlocked ? COLORS.deepGreen : "#9A8E6E" }}>
                  {a.label}
                </div>
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

// ==================================================
// App shell
// ==================================================
const TABS = [
  { key: "journey", label: "旅程", icon: "🏍️" },
  { key: "map", label: "地圖", icon: "📍" },
  { key: "quest", label: "任務", icon: "🎯" },
  { key: "badge", label: "成就", icon: "🏆" },
];

function App() {
  const [tab, setTab] = useState("journey");
  // Shared trip state lifted here too, so 任務/成就 tabs can read the same data
  // without duplicating storage logic — each tab does its own light polling.
  const [trip, setTrip] = useState(DEFAULT_TRIP);
  const [people, setPeople] = useState(FAMILY.map((p) => ({ ...p, checkedIn: false })));
  const pollRef = useRef(null);

  const fetchShared = async () => {
    try {
      const res = await window.storage.get(TRIP_KEY, true);
      const data = res ? JSON.parse(res.value) : null;
      if (data) setTrip({ ...DEFAULT_TRIP, ...data, tasks: { ...DEFAULT_TRIP.tasks, ...(data.tasks || {}) } });
    } catch (e) {}
    try {
      const { members } = await fetchSheetData();
      setPeople((prev) =>
        prev.map((p) => {
          const row = members.find((m) => m.id === p.sheetId);
          return row ? { ...p, checkedIn: isTruthy(row.checkedIn) } : p;
        })
      );
    } catch (e) {}
  };

  useEffect(() => {
    if (tab === "quest" || tab === "badge") {
      fetchShared();
      pollRef.current = setInterval(fetchShared, POLL_MS);
      return () => clearInterval(pollRef.current);
    }
  }, [tab]);

  const writeTrip = async (next) => {
    setTrip(next);
    try {
      await window.storage.set(TRIP_KEY, JSON.stringify(next), true);
    } catch (e) {}
  };

  const checkedCount = people.filter((p) => p.checkedIn).length;

  return (
    <div
      style={{
        maxWidth: 420, margin: "0 auto", minHeight: "100vh", background: COLORS.cream,
        fontFamily: '"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif',
        position: "relative",
      }}
    >
      {tab === "journey" && <JourneyHome />}
      {tab === "map" && <MapTab />}
      {tab === "quest" && (
        <TaskTab
          trip={trip}
          checkedCount={checkedCount}
          onToggle={(key) => writeTrip({ ...trip, tasks: { ...trip.tasks, [key]: true } })}
        />
      )}
      {tab === "badge" && <AchievementTab ctx={{ checkedCount, trip }} />}

      <div
        style={{
          position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 420,
          background: COLORS.warmWhite, borderTop: "1px solid #E9DFC4", display: "flex", justifyContent: "space-around",
          padding: "10px 4px 14px", boxShadow: "0 -6px 18px rgba(31,74,61,0.10)",
        }}
      >
        {TABS.map((t) => {
          const active = tab === t.key;
          return (
            <button
              key={t.key}
              onClick={() => setTab(t.key)}
              style={{ background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer", padding: "2px 8px" }}
            >
              <span style={{ fontSize: 20, opacity: active ? 1 : 0.45 }}>{t.icon}</span>
              <span style={{ fontSize: 11, fontWeight: active ? 800 : 500, color: active ? COLORS.deepGreen : "#B0A480" }}>{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
